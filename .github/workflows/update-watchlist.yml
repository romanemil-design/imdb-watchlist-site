
name: Update IMDb watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check IMDb watchlist
        run: |
          curl -sS -L \
            -A "Mozilla/5.0" \
            -o watchlist-response.html \
            -w "HTTP status: %{http_code}\n" \
            "https://www.imdb.com/user/ur210854686/watchlist/"
          head -c 500 watchlist-response.html

      - name: Save response for inspection
        run: |
          mkdir -p data
          cp watchlist-response.html data/watchlist-response.html

      - name: Commit response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist-response.html
          git diff --cached --quiet || git commit -m "Update IMDb response"
          git push
