
name: Update IMDb Watchlist Site

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch watchlist and generate website
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import html
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime

          API_KEY = os.environ.get("OMDB_API_KEY", "").strip()
          if not API_KEY:
              raise RuntimeError("Missing GitHub secret OMDB_API_KEY.")

          USER_ID = "ur210854686"
          GRAPHQL_URL = "https://api.graphql.imdb.com/"

          query = """
          query GetWatchlist($userId: ID!, $first: Int!, $after: String) {
            predefinedList(classType: WATCH_LIST, userId: $userId) {
              titleListItemSearch(first: $first, after: $after) {
                edges {
                  title {
                    id
                    titleText { text }
                    releaseYear { year }
                  }
                }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
          """

          # 1. Get every title from IMDb.
          watchlist = []
          after = None
          seen_cursors = set()

          while True:
              payload = {
                  "query": query,
                  "variables": {
                      "userId": USER_ID,
                      "first": 250,
                      "after": after
                  }
              }

              request = urllib.request.Request(
                  GRAPHQL_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0",
                      "x-imdb-client-name": "imdb-web-next"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      "IMDb HTTP " + str(exc.code) + ": " +
                      exc.read().decode("utf-8", errors="replace")
                  )

              if result.get("errors"):
                  raise RuntimeError(
                      "IMDb GraphQL error: " +
                      json.dumps(result["errors"], ensure_ascii=False)
                  )

              listing = (result.get("data") or {}).get("predefinedList")
              if listing is None:
                  raise RuntimeError("IMDb watchlist was not returned.")

              connection = listing.get("titleListItemSearch")
              if connection is None:
                  raise RuntimeError("IMDb returned no title connection.")

              for edge in connection.get("edges", []):
                  title = edge.get("title") or {}
                  imdb_id = title.get("id")
                  if imdb_id:
                      watchlist.append({
                          "imdbID": imdb_id,
                          "Title": (title.get("titleText") or {}).get("text") or "",
                          "Year": (title.get("releaseYear") or {}).get("year")
                      })

              page_info = connection.get("pageInfo") or {}
              print("IMDb titles retrieved:", len(watchlist))

              if not page_info.get("hasNextPage"):
                  break

              after = page_info.get("endCursor")
              if not after or after in seen_cursors:
                  raise RuntimeError("Invalid or repeated IMDb pagination cursor.")
              seen_cursors.add(after)

          if not watchlist:
              raise RuntimeError("IMDb returned zero titles; refusing to publish.")

          # 2. Enrich every title using OMDb.
          movies = []
          failed = []

          for index, item in enumerate(watchlist, start=1):
              params = urllib.parse.urlencode({
                  "apikey": API_KEY,
                  "i": item["imdbID"],
                  "plot": "full"
              })
              url = "https://www.omdbapi.com/?" + params
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "IMDb-Watchlist-Site/1.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      details = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      "OMDb HTTP " + str(exc.code) +
                      ". Check the API key and request limit."
                  )

              if details.get("Response") != "True":
                  error = details.get("Error", "Unknown OMDb error")
                  if (
                      "invalid api key" in error.lower()
                      or "request limit" in error.lower()
                  ):
                      raise RuntimeError("OMDb error: " + error)

                  print("OMDb metadata unavailable:", item["imdbID"], error)
                  failed.append(item["imdbID"])
                  details = {}

              movie = dict(item)

              for field in [
                  "Title", "Year", "Type", "Poster", "Genre", "Runtime",
                  "imdbRating", "imdbVotes", "Released", "Plot"
              ]:
                  value = details.get(field)
                  if value and value != "N/A":
                      movie[field] = value

              movie["imdbID"] = item["imdbID"]
              movies.append(movie)

              print("OMDb:", index, "/", len(watchlist), item["imdbID"])
              time.sleep(0.15)

          # 3. Sort newest release date first.
          # If only a year is available, use the year as a fallback.
          # Titles with no date or year go last.
          def release_date(movie):
              value = movie.get("Released", "")
              try:
                  return datetime.strptime(value, "%d %b %Y").date()
              except (ValueError, TypeError):
                  return None

          def sort_key(movie):
              date = release_date(movie)
              if date:
                  return (1, date.toordinal())

              year_text = str(movie.get("Year", "")).rstrip("-–— ").strip()
              try:
                  year = int(year_text[:4])
                  return (1, year * 10000)
              except (ValueError, TypeError):
                  return (0, 0)

          movies.sort(key=sort_key, reverse=True)

          # 4. Save enriched data.
          os.makedirs("data", exist_ok=True)

          with open("data/watchlist.json", "w", encoding="utf-8") as file:
              json.dump(watchlist, file, ensure_ascii=False, indent=2)

          with open("data/movies.json", "w", encoding="utf-8") as file:
              json.dump(movies, file, ensure_ascii=False, indent=2)

          # 5. Generate the website.
          def esc(value):
              return html.escape(str(value or "N/A"), quote=True)

          cards = []

          for movie in movies:
              imdb_id = movie["imdbID"]
              title = movie.get("Title") or movie.get("imdbID", "")
              year = str(movie.get("Year", "N/A")).rstrip("-–— ").strip()

              imdb_link = "https://www.imdb.com/title/" + imdb_id + "/"

              # Remove a trailing dash from the year before building torrent URLs.
              torrent_query = (str(title) + " " + year).strip()
              torrent_link = (
                  "https://rargb.to/search/?search=" +
                  urllib.parse.quote_plus(torrent_query)
              )
              torrent_link_1080 = (
                  "https://rargb.to/search/?search=" +
                  urllib.parse.quote_plus(torrent_query + " 1080p") +
                  "&order=seeders&by=DESC"
              )

              poster = movie.get("Poster", "")
              if poster and poster != "N/A":
                  poster_html = (
                      '<img loading="lazy" src="' + esc(poster) +
                      '" alt="' + esc(title) + ' poster">'
                  )
              else:
                  poster_html = '<div class="no-poster">No poster</div>'

              rating = movie.get("imdbRating", "N/A")
              if rating != "N/A":
                  rating += "/10"

              cards.append("""
                <article class="movie-card">
                  <div class="poster">POSTER_HTML</div>
                  <div class="movie-info">
                    <h2><a href="IMDB_LINK" target="_blank"
                      rel="noopener noreferrer">MOVIE_TITLE (MOVIE_YEAR)</a></h2>
                    <p><strong>Genre:</strong> GENRE</p>
                    <p><strong>Runtime:</strong> RUNTIME</p>
                    <p><strong>IMDb Rating:</strong> RATING</p>
                    <p><strong>Released:</strong> RELEASED</p>
                    <p class="plot"><strong>Plot:</strong> PLOT</p>
                    <p><strong>Torrents:</strong>
                      <a href="TORRENT_LINK" target="_blank"
                      rel="noopener noreferrer">Search</a></p>
                    <p><strong>Torrents 1080p:</strong>
                      <a href="TORRENT_1080_LINK" target="_blank"
                      rel="noopener noreferrer">Search</a></p>
                  </div>
                </article>
              """.replace("POSTER_HTML", poster_html)
                 .replace("IMDB_LINK", esc(imdb_link))
                 .replace("MOVIE_TITLE (MOVIE_YEAR)", esc(title) + " (" + esc(year) + ")")
                 .replace("GENRE", esc(movie.get("Genre")))
                 .replace("RUNTIME", esc(movie.get("Runtime")))
                 .replace("RATING", esc(rating))
                 .replace("RELEASED", esc(movie.get("Released")))
                 .replace("PLOT", esc(movie.get("Plot")))
                 .replace("TORRENT_1080_LINK", esc(torrent_link_1080))
                 .replace("TORRENT_LINK", esc(torrent_link)))

          page = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="My IMDb watchlist sorted by release date">
            <title>My IMDb Watchlist</title>
            <style>
              * { box-sizing: border-box; }
              body {
                background: #111;
                color: #eee;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 24px;
              }
              h1 {
                text-align: center;
                color: #ffcc00;
              }
              .count {
                text-align: center;
                color: #aaa;
                margin-bottom: 30px;
              }
              .movie-card {
                display: flex;
                gap: 20px;
                margin: 0 auto 28px;
                max-width: 1000px;
                border-bottom: 1px solid #444;
                padding-bottom: 24px;
              }
              .poster img {
                display: block;
                width: 150px;
                height: auto;
                object-fit: cover;
                border-radius: 4px;
              }
              .no-poster {
                width: 150px;
                height: 220px;
                background: #252525;
                color: #999;
                display: grid;
                place-items: center;
              }
              .movie-info { min-width: 0; }
              .movie-info h2 {
                margin: 0 0 12px;
                font-size: 1.4rem;
              }
              .movie-info h2 a {
                color: #ffcc00;
                text-decoration: none;
              }
              .movie-info h2 a:hover { text-decoration: underline; }
              .movie-info p {
                margin: 6px 0;
                line-height: 1.45;
              }
              .movie-info a { color: #8dcaff; }
              .plot { max-width: 760px; }
              @media (max-width: 600px) {
                body { padding: 14px; }
                .movie-card { gap: 12px; }
                .poster img, .no-poster { width: 100px; }
                .no-poster { height: 150px; }
                .movie-info h2 { font-size: 1.1rem; }
                .movie-info p { font-size: 0.9rem; }
              }
            </style>
          </head>
          <body>
            <h1>My IMDb Watchlist</h1>
            <p class="count">TITLE_COUNT titles · Newest releases first</p>
            MOVIE_CARDS
          </body>
          </html>
          """

          page = page.replace("TITLE_COUNT", str(len(movies)))
          page = page.replace("MOVIE_CARDS", "\n".join(cards))

          with open("index.html", "w", encoding="utf-8") as file:
              file.write(page)

          print("SUCCESS: generated index.html and data/movies.json")
          print("Total titles:", len(movies))

          if failed:
              print("Titles without OMDb metadata:", ", ".join(failed))
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/watchlist.json data/movies.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IMDb watchlist website"
            git push
          fi
