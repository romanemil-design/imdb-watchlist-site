
name: Fetch IMDb Watchlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-watchlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch all IMDb watchlist titles
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          USER_ID = "ur210854686"
          URL = "https://api.graphql.imdb.com/"

          query = """
          query GetWatchlist($userId: ID!, $first: Int!, $after: String) {
            predefinedList(classType: WATCH_LIST, userId: $userId) {
              titleListItemSearch(first: $first, after: $after) {
                edges {
                  title {
                    id
                    titleText { text }
                    releaseYear { year }
                  }
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
          """

          movies = []
          after = None
          seen_cursors = set()
          page = 0

          while True:
              payload = {
                  "query": query,
                  "variables": {
                      "userId": USER_ID,
                      "first": 250,
                      "after": after
                  }
              }

              request = urllib.request.Request(
                  URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0",
                      "x-imdb-client-name": "imdb-web-next"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      "IMDb returned HTTP " + str(exc.code) + ": " +
                      exc.read().decode("utf-8", errors="replace")
                  )

              if result.get("errors"):
                  raise RuntimeError(
                      "IMDb GraphQL error: " +
                      json.dumps(result["errors"], ensure_ascii=False)
                  )

              listing = (result.get("data") or {}).get("predefinedList")
              if listing is None:
                  raise RuntimeError(
                      "IMDb returned no watchlist. Check the user ID "
                      "and whether the watchlist is publicly accessible."
                  )

              connection = listing.get("titleListItemSearch")
              if connection is None:
                  raise RuntimeError("IMDb returned no title connection.")

              page += 1
              for edge in connection.get("edges", []):
                  title = edge.get("title") or {}
                  imdb_id = title.get("id")
                  if imdb_id:
                      movies.append({
                          "imdbID": imdb_id,
                          "Title": (title.get("titleText") or {}).get("text"),
                          "Year": (title.get("releaseYear") or {}).get("year")
                      })

              page_info = connection.get("pageInfo") or {}
              print("Page", page, "- total titles:", len(movies))

              if not page_info.get("hasNextPage"):
                  break

              after = page_info.get("endCursor")
              if not after or after in seen_cursors:
                  raise RuntimeError("Invalid or repeated pagination cursor.")
              seen_cursors.add(after)

          if not movies:
              raise RuntimeError(
                  "No titles were retrieved; refusing to save an empty list."
              )

          os.makedirs("data", exist_ok=True)
          with open("data/watchlist.json", "w", encoding="utf-8") as f:
              json.dump(movies, f, ensure_ascii=False, indent=2)

          print("SUCCESS: saved", len(movies), "titles to data/watchlist.json")
          PY

      - name: Commit watchlist data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          if git diff --cached --quiet; then
            echo "Watchlist has not changed."
          else
            git commit -m "Update IMDb watchlist data"
            git push
          fi
